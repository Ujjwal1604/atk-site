<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATK Site Editor</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: -20px;
        }

        .login-box {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
        }

        .login-box h1 {
            margin-bottom: 20px;
            color: #2d3748;
        }

        .login-box p {
            color: #718096;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .editor-screen {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2d3748;
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .file-list {
            list-style: none;
        }

        .file-item {
            padding: 12px 15px;
            margin: 5px 0;
            background: #f7fafc;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .file-item:hover {
            background: #edf2f7;
            transform: translateX(5px);
        }

        .file-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .editor-panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-header h2 {
            color: #2d3748;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            height: 500px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }

        .welcome-panel {
            background: white;
            border-radius: 15px;
            padding: 60px 30px;
            text-align: center;
            color: #718096;
        }

        .welcome-panel h2 {
            color: #2d3748;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>🔐 ATK Site Editor</h1>
            <p>Please log in to edit website content</p>
            <button onclick="login()" class="btn">Log In</button>
        </div>
    </div>

    <div id="editorScreen" class="editor-screen">
        <div class="header">
            <h1>📝 ATK Site Editor</h1>
            <div class="header-actions">
                <button onclick="downloadBuild()" class="btn">📦 Download Website</button>
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </div>

        <div class="content">
            <div class="sidebar">
                <h2>Data Files</h2>
                <ul class="file-list" id="fileList"></ul>
            </div>

            <div class="editor-panel">
                <div id="welcomePanel" class="welcome-panel">
                    <h2>Welcome!</h2>
                    <p>Select a file from the sidebar to start editing</p>
                </div>

                <div id="editorPanel" style="display: none;">
                    <div class="editor-header">
                        <h2 id="currentFileName">No file selected</h2>
                        <button onclick="saveFile()" class="btn" id="saveBtn">Save Changes</button>
                    </div>
                    <textarea id="editor" placeholder="Select a file to edit..."></textarea>
                    <div id="status" class="status"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dataFiles = [
            { name: 'Alumni Joint PhD', file: '_data/alumni_joint_phd.json' },
            { name: 'Alumni PhD', file: '_data/alumni_phd.json' },
            { name: 'Alumni Post Doc', file: '_data/alumni_post_doc.json' },
            { name: 'Members', file: '_data/members.json' },
            { name: 'Projects BTech', file: '_data/projects_btech.json' },
            { name: 'Projects PG', file: '_data/projects_pg.json' },
            { name: 'Publications', file: '_data/publications.json' },
            { name: 'Site Settings', file: '_data/site.json' }
        ];

        let currentFile = null;
        let currentSha = null;
        let user = null;

        // Initialize Netlify Identity
        netlifyIdentity.on('init', user => {
            if (user) {
                showEditor(user);
            }
        });

        netlifyIdentity.on('login', user => {
            showEditor(user);
            netlifyIdentity.close();
        });

        netlifyIdentity.on('logout', () => {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('editorScreen').style.display = 'none';
        });

        function login() {
            netlifyIdentity.open();
        }

        function logout() {
            netlifyIdentity.logout();
        }

        function showEditor(loggedInUser) {
            user = loggedInUser;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('editorScreen').style.display = 'block';
            loadFileList();
        }

        function loadFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            dataFiles.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.textContent = file.name;
                li.onclick = () => loadFile(file);
                fileList.appendChild(li);
            });
        }

        async function loadFile(file) {
            showStatus('Loading...', 'info');

            try {
                const response = await fetch('/.netlify/functions/github-read', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ file: file.file })
                });

                if (!response.ok) throw new Error('Failed to load file');

                const data = await response.json();
                const content = atob(data.content);

                currentFile = file;
                currentSha = data.sha;

                document.getElementById('welcomePanel').style.display = 'none';
                document.getElementById('editorPanel').style.display = 'block';
                document.getElementById('currentFileName').textContent = file.name;
                document.getElementById('editor').value = JSON.stringify(JSON.parse(content), null, 2);

                // Update active state
                document.querySelectorAll('.file-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.textContent === file.name) {
                        item.classList.add('active');
                    }
                });

                hideStatus();
            } catch (error) {
                showStatus('Error loading file: ' + error.message, 'error');
            }
        }

        async function saveFile() {
            if (!currentFile) return;

            const content = document.getElementById('editor').value;

            // Validate JSON
            try {
                JSON.parse(content);
            } catch (e) {
                showStatus('Invalid JSON! Please fix errors before saving.', 'error');
                return;
            }

            showStatus('Saving...', 'info');
            document.getElementById('saveBtn').disabled = true;

            try {
                const response = await fetch('/.netlify/functions/github-write', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        file: currentFile.file,
                        content: btoa(content),
                        sha: currentSha,
                        message: `Update ${currentFile.name} via web editor`
                    })
                });

                if (!response.ok) throw new Error('Failed to save file');

                const data = await response.json();
                currentSha = data.content.sha;

                showStatus('✅ Saved successfully! Netlify is rebuilding the site (takes 2-3 minutes)', 'success');
            } catch (error) {
                showStatus('Error saving: ' + error.message, 'error');
            } finally {
                document.getElementById('saveBtn').disabled = false;
            }
        }

        function downloadBuild() {
            showStatus('Opening Netlify dashboard to download the latest build...', 'info');
            window.open('https://app.netlify.com/sites/atkhan/deploys', '_blank');

            setTimeout(() => {
                if (confirm('Need help downloading?\n\n1. Click on the latest deploy (green ✓)\n2. Scroll down to "Deploy summary"\n3. Click the three dots (⋮) menu\n4. Click "Download deploy"\n\nClick OK to see detailed instructions.')) {
                    window.open('https://atkhan.netlify.app/atk/download.html', '_blank');
                }
            }, 2000);
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function hideStatus() {
            const status = document.getElementById('status');
            status.className = 'status';
        }

        // Initialize
        netlifyIdentity.init();
    </script>
</body>

</html>
